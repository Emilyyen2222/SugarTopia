<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Write a Review</title>
    <link rel="stylesheet" href="CSS/style.css"> 
    <link rel="stylesheet" href="CSS/write_review.css"> 
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="Js/site-enhancements.js" defer></script>
    <script src="Js/auth.js" defer></script>
    <script src="Js/reviews.js" defer></script>
</head>
<body>
    <header class="header">
        <div class="header-container">
            <nav class="nav-menu">
                <div class="nav-categories">
                    <button type="button" class="nav-categories-toggle">
                        Categories
                        <svg class="nav-categories-caret" width="12" height="8" viewBox="0 0 12 8" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M1 1.5L6 6.5L11 1.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                    <div class="nav-categories-panel">
                        <a href="category.html?q=Cinnamon%20Rolls">Cinnamon Rolls</a>
                        <a href="category.html?q=Ice%20Creams">Ice Creams</a>
                        <a href="category.html?q=Bagels">Bagels</a>
                        <a href="category.html?q=Cheesecakes">Cheese Cakes</a>
                        <a href="category.html?q=Macaron">Macaron</a>
                        <a href="category.html?q=Cafes">Cafes</a>
                        <a href="category.html?q=Dogs%20Friendly">Dog Friendly</a>
                        <a href="category.html?q=Alcohol">Alcohol Infused</a>
                    </div>
                </div>
            </nav>

            <div class="logo-container">
                <a href="index.html">
                    <img src="./img/1207.svg" alt="Sugar.Topia">
                </a>
            </div>

            <div class="actions">
                <a href="https://www.instagram.com/cupertino.keki/" class="brand-name">
                    cupertino.keki
                    <i class="fa-solid fa-arrow-up-right-from-square link-icon"></i>
                </a>
                <a href="login.html" class="btn-login">Log In</a>
                <a href="signup.html" class="btn-signup">Sign Up</a>
            </div>
        </div>
    </header>


    <main>
        <section class="review-section">
            <h1>Write a Review</h1>
            <form class="review-form" data-review-form="write">
                <div class="form-group">
                    <label for="dessert-shop-id">Dessert Shop:</label>
                    <div id="dessert-shop-field">Loading shops...</div>
                </div>
                <div class="form-group">
                    <label for="review-text">Your Review:</label>
                    <textarea id="review-text" name="review-text" rows="4" required></textarea>
                </div>
                <div class="form-group">
                    <label for="rating">Rate Desserts:</label>
                    <div class="rating-system">
                        <input type="radio" id="star1" name="rating" value="5">
                        <label for="star1" class="fa fa-star"></label>
                        <input type="radio" id="star2" name="rating" value="4">
                        <label for="star2" class="fa fa-star"></label>
                        <input type="radio" id="star3" name="rating" value="3">
                        <label for="star3" class="fa fa-star"></label>
                        <input type="radio" id="star4" name="rating" value="2">
                        <label for="star4" class="fa fa-star"></label>
                        <input type="radio" id="star5" name="rating" value="1">
                        <label for="star5" class="fa fa-star"></label>
                    </div>
                </div>
                <div class="form-group">
                    <label for="photo-upload">Share Photos of Desserts:</label>
                    <input type="file" id="photo-upload" name="photo-upload" accept="image/*" multiple>
                </div>
                <button type="submit" class="submit-btn">Submit Review</button>
            </form>
        </section>
    </main>

            <a href="#"><i class="fab fa-twitter"></i></a>

            <a href="#"><i class="fab fa-linkedin-in"></i></a>
        </div>
    </div>
</footer>
</body>
</html>
