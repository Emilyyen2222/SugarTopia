<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Sugar.Topia</title>
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/login.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="Js/site-enhancements.js" defer></script>
    <script src="Js/auth.js" defer></script>
</head>
<body>
    <!-- Header 與 login.html 相同 -->
    <header class="header">
        <div class="header-container">
            <nav class="nav-menu">
                <div class="nav-categories">
                    <button type="button" class="nav-categories-toggle">
                        Categories
                        <svg class="nav-categories-caret" width="12" height="8" viewBox="0 0 12 8" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M1 1.5L6 6.5L11 1.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                    <div class="nav-categories-panel">
                        <a href="category.html?q=Cinnamon%20Rolls">Cinnamon Rolls</a>
                        <a href="category.html?q=Ice%20Creams">Ice Creams</a>
                        <a href="category.html?q=Bagels">Bagels</a>
                        <a href="category.html?q=Cheesecakes">Cheese Cakes</a>
                        <a href="category.html?q=Macaron">Macaron</a>
                        <a href="category.html?q=Cafes">Cafes</a>
                        <a href="category.html?q=Dogs%20Friendly">Dog Friendly</a>
                        <a href="category.html?q=Alcohol">Alcohol Infused</a>
                    </div>
                </div>
            </nav>

            <div class="logo-container">
                <a href="index.html">
                    <img src="img/11211.svg" alt="Sugar.Topia">
                </a>
            </div>

            <div class="actions">
                <a href="write_review.html">write a review</a>
                <a href="https://www.instagram.com/cupertino.keki/" class="brand-name">
                    cupertino.keki
                    <i class="fa-solid fa-arrow-up-right-from-square link-icon"></i>
                </a>
            </div>
        </div>
    </header>

    <!-- 註冊表單區域 -->
    <main class="login-container">
        <div class="login-box">
            <h1>Create Account</h1>
            <p class="subtitle">Join Sugar.Topia today</p>
            
            <form class="login-form" data-auth-form="signup">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Create a password" required>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" placeholder="Confirm your password" required>
                </div>
                
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="terms">
                        <span>I agree to the Terms of Service and Privacy Policy</span>
                    </label>
                </div>
                
                <button type="submit" class="login-button">Sign Up</button>
                
                <p class="signup-link">
                    Already have an account? <a href="login.html">Log in</a>
                </p>
            </form>
        </div>
    </main>

    <!-- Footer 與 login.html 相同 -->
    <footer>
        <div class="footer-content">
            <p>Sugar.Topia @ 2024. All rights not reserved.</p>
            <div class="footer-links">
                <a href="#">About</a>
                <a href="#">Service</a>
                <a href="#">Business</a>
            </div>
            <div class="footer_social-icons">
                <a href="#"><i class="fab fa-youtube"></i></a>
                <a href="#"><i class="fab fa-facebook-f"></i></a>
                <a href="#"><i class="fab fa-twitter"></i></a>
                <a href="https://www.instagram.com/cupertino.keki/"><i class="fab fa-instagram"></i></a>
                <a href="#"><i class="fab fa-linkedin-in"></i></a>
            </div>
        </div>
    </footer>
</body>
</html>
